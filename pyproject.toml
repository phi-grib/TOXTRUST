[project]
name = "toxtrust"
version = "0.2"
description = "DST-based toxicological evidence combinator"
authors = [{ name = "Karolina Kopanska", email = "karolinaweronika.kopanska@upf.edu" }]
license = { text = "GPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "flask-cors",
    "pyyaml",
    "requests",
    "scikit-learn",
    "scipy",
    "numpy",
    "pandas",
    "matplotlib",
    "more-itertools",
    "ipython",
    "xlsxwriter",
]

[project.scripts]
toxtrust = "toxtrust.console:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["toxtrust"]
package-data = { toxtrust = ["config.yaml"] }
